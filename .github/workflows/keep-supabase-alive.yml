name: Keep Services Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          REF:  ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$REF" ] || [ -z "$ANON" ]; then
            echo "Missing SUPABASE_PROJECT_REF or SUPABASE_ANON_KEY"; exit 1
          fi
          curl -X GET "https://${REF}.supabase.co/rest/v1/studies?limit=1" \
               -H "apikey: ${ANON}" \
               -H "Content-Type: application/json" \
               --fail --retry 3 --retry-delay 5 --max-time 10

  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health
        run: |
          curl -X GET "https://research-portalc.onrender.com/health" \
               --fail --retry 3 --retry-delay 5 --max-time 10

  send-reflection-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Send reflection reminders
        run: node scripts/send-reflection-reminders.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY:       ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:           ${{ secrets.EMAIL_FROM }}
