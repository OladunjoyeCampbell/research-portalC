name: Keep Services Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/" \
               -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Content-Type: application/json" \
               --fail --retry 3 --retry-delay 5 --max-time 10

  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health
        run: |
          curl -X GET "https://research-portalc.onrender.com/health" \
               --fail --retry 3 --retry-delay 5 --max-time 10