name: Keep Services Alive

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/rest/v1/studies?limit=1" \
               -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
               -H "Content-Type: application/json" \
               --fail --retry 3 --retry-delay 5 --max-time 10

  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health
        run: |
          curl -X GET "https://research-portalc.onrender.com/health" \
               --fail --retry 3 --retry-delay 5 --max-time 10

  send-reflection-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Send reflection reminders
        run: node scripts/send-reflection-reminders.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}